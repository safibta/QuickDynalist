name: Build test APK
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"
      - name: Build separate test app
        run: bash gradlew assembleSafiTestDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Quick-Dynalist-Test
          path: app/build/outputs/apk/safiTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14
